name: governance

on:
  push:
    branches: [main]
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    if: >-
      (github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
      (github.event.action == 'submitted' ||
      (github.event.action == 'dismissed' &&
      github.event.review.commit_id == github.event.pull_request.head.sha)))
    permissions:
      contents: read
      pull-requests: read
    uses: wellmanifest/new-project/.github/workflows/governance.yml@e65857ea2f62b20e4b830e3c5f611878bf31bb25
    with:
      standard-ref: e65857ea2f62b20e4b830e3c5f611878bf31bb25
      trusted-validator-apps: 'ifuri-validator-agent[bot]'
